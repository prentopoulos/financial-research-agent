<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agents-title agents-desc" id="agent-workflows-root">
<title id="agents-title">Ledger agent workflows and model sequence</title><desc id="agents-desc">Three bounded LangGraph workflows show how company research, report chat, and market explore ground evidence, use GPT-5 mini, verify outputs, and deliver cited results.</desc>

  <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #agent-workflows-root { color: #0e131c; font-family: 'DM Sans',Arial,sans-serif; }
      #agent-workflows-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#agent-workflows-root .diagram-container { overflow-x:visible }
}
      #agent-workflows-root .paper { fill:#fff }
      #agent-workflows-root .dots { fill:url(#agent-workflows-dots);opacity:.38 }
