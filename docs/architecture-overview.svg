<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Ledger agentic architecture</title>
  <desc id="desc">A ticker moves through LangGraph, public evidence retrieval, Python calculations, peer verification, and ends as a cited report. An optional model can assist with peers and prose.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#53657d"/>
    </marker>
    <style>
      .sans { font-family: "DM Sans", "Segoe UI", Arial, sans-serif; }
      .serif { font-family: "Instrument Serif", Georgia, serif; }
      .kicker { fill: #53657d; font-size: 15px; font-weight: 700; letter-spacing: 2px; }
      .name { fill: #0e131c; font-size: 27px; }
      .note { fill: #53657d; font-size: 15px; }
      .step { fill: #306bd9; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1600" height="620" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1599" height="619" fill="none" stroke="#d9e1ec"/>

  <g class="sans">
    <rect x="52" y="38" width="36" height="36" fill="#0e131c"/>
    <text x="70" y="64" text-anchor="middle" fill="#ffffff" class="serif" font-size="25">L</text>
    <text x="106" y="62" fill="#0e131c" font-size="16" font-weight="700" letter-spacing="3">LEDGER</text>
    <text x="1548" y="62" text-anchor="end" class="kicker">AGENTIC ARCHITECTURE</text>
  </g>
  <line x1="0" y1="104" x2="1600" y2="104" stroke="#d9e1ec"/>

  <g fill="none" stroke="#53657d" stroke-width="2" marker-end="url(#arrow)">
    <path d="M207 320H314"/>
    <path d="M510 320H619"/>
    <path d="M815 320H924"/>
    <path d="M1120 320H1229"/>
    <path d="M1425 320H1502"/>
  </g>

  <g class="sans">
    <circle cx="132" cy="320" r="75" fill="#0e131c"/>
    <text x="132" y="307" text-anchor="middle" fill="#a9b7ca" font-size="12" font-weight="700" letter-spacing="1">START</text>
    <text x="132" y="340" text-anchor="middle" fill="#ffffff" class="serif" font-size="30">Ticker</text>

    <circle cx="412" cy="320" r="98" fill="#edf3fc" stroke="#306bd9" stroke-width="2"/>
    <text x="412" y="288" text-anchor="middle" class="step">ORCHESTRATE</text>
    <text x="412" y="326" text-anchor="middle" class="name serif">LangGraph</text>
    <text x="412" y="351" text-anchor="middle" class="note">shared state</text>

    <circle cx="717" cy="320" r="98" fill="#ffffff" stroke="#0e131c" stroke-width="1.5"/>
    <text x="717" y="288" text-anchor="middle" class="step">RETRIEVE</text>
    <text x="717" y="326" text-anchor="middle" class="name serif">Evidence</text>
    <text x="717" y="351" text-anchor="middle" class="note">SEC · market</text>

    <circle cx="1022" cy="320" r="98" fill="#ffffff" stroke="#0e131c" stroke-width="1.5"/>
    <text x="1022" y="288" text-anchor="middle" class="step">CALCULATE</text>
    <text x="1022" y="326" text-anchor="middle" class="name serif">Python</text>
    <text x="1022" y="351" text-anchor="middle" class="note">figures · verdict</text>

    <circle cx="1327" cy="320" r="98" fill="#ffffff" stroke="#0e131c" stroke-width="1.5"/>
    <text x="1327" y="288" text-anchor="middle" class="step">VERIFY</text>
    <text x="1327" y="326" text-anchor="middle" class="name serif">Peers</text>
    <text x="1327" y="351" text-anchor="middle" class="note">checked again</text>

    <circle cx="1530" cy="320" r="68" fill="#0e131c"/>
    <text x="1530" y="307" text-anchor="middle" fill="#a9b7ca" font-size="12" font-weight="700" letter-spacing="1">END</text>
    <text x="1530" y="336" text-anchor="middle" fill="#ffffff" class="serif" font-size="25">Report</text>
  </g>

  <g class="sans">
    <circle cx="1327" cy="155" r="58" fill="#ffffff" stroke="#53657d" stroke-width="1.5" stroke-dasharray="7 6"/>
    <text x="1327" y="148" text-anchor="middle" class="name serif" font-size="22">Model</text>
    <text x="1327" y="172" text-anchor="middle" class="note" font-size="13">optional</text>
    <path d="M1304 209L1261 240" fill="none" stroke="#53657d" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
    <path d="M1370 194L1492 259" fill="none" stroke="#53657d" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  </g>

  <line x1="52" y1="478" x2="1548" y2="478" stroke="#d9e1ec"/>
  <g class="sans kicker" font-size="13">
    <text x="52" y="528">PUBLIC DATA ONLY</text>
    <text x="800" y="528" text-anchor="middle">PYTHON OWNS THE MATH</text>
    <text x="1548" y="528" text-anchor="end">CITATIONS + TRACE</text>
  </g>
  <text x="52" y="578" class="sans note">One bounded path. Every node is visible. Missing evidence stays missing.</text>
</svg>
