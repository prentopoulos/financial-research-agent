<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Ledger agent architecture</title>
  <style>
    :root {
      --paper: #ffffff;
      --ink: #172033;
      --muted: #66758a;
      --line: #d9e0ea;
      --blue: #3f78c5;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; margin: 0; color: var(--ink); background: var(--paper); font-family: Inter, "Segoe UI", Arial, sans-serif; }
    a { color: inherit; text-underline-offset: 3px; }
    a:focus-visible, .diagram:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 18px clamp(20px, 4vw, 56px); border-bottom: 1px solid var(--line); }
    .brand { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-decoration: none; }
    .meta { color: var(--muted); font-size: 12px; }
    main { width: min(1500px, 100%); margin: 0 auto; padding: clamp(36px, 5vw, 72px) clamp(20px, 4vw, 56px) 56px; }
    h1 { margin: 0; font-size: clamp(34px, 5vw, 56px); line-height: 1.05; letter-spacing: -.035em; }
    .lede { margin: 14px 0 0; color: var(--muted); font-size: 17px; }
    figure { margin: clamp(32px, 5vw, 56px) 0 0; }
    .diagram { overflow-x: auto; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); }
    .diagram img { display: block; width: 100%; min-width: 980px; height: auto; }
    figcaption { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 16px; color: var(--muted); font-size: 13px; }
    .dot { display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--blue); }
    .dot.optional { background: #98a6b8; }
    footer { display: flex; justify-content: space-between; gap: 24px; margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    @media (max-width: 680px) { footer { flex-direction: column; } }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
    @media print { main { padding: 24px; } .diagram { overflow: visible; } .diagram img { min-width: 0; } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="#top">LEDGER</a>
    <span class="meta">System map · Phase 1</span>
  </header>

  <main id="top">
    <h1>Agent architecture</h1>
    <p class="lede">One ticker in. One cited report out.</p>

    <figure>
      <div class="diagram" role="region" tabindex="0" aria-label="Scrollable Ledger agent architecture diagram">
        <img src="architecture-overview.svg" alt="A ticker enters a LangGraph orchestrator, then moves through evidence retrieval, Python calculations, peer verification, and report writing before becoming a cited report. Model assistance is optional.">
      </div>
      <figcaption>
        <span><i class="dot"></i>Required: evidence and deterministic analysis</span>
        <span><i class="dot optional"></i>Optional: model support for peers and prose</span>
      </figcaption>
    </figure>

    <footer>
      <span>Public data · Python-owned math · source-linked output</span>
      <a href="../README.md">Project README</a>
    </footer>
  </main>
</body>
</html>
