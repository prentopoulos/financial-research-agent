<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ledger security boundary</title>
  <desc id="desc">The Ledger browser sends a validated ticker into a public research boundary. The boundary retrieves public SEC and market data, performs deterministic analysis, and may call one configured model endpoint or LangSmith. Sensitive data is disabled and secrets remain outside graph state.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#79c7ff"/></marker>
    <style>
      text { font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace; }
      .title { fill: #dcecff; font-size: 44px; }
      .label { fill: #dcecff; font-size: 17px; }
      .small { fill: #9db6ce; font-size: 14px; }
      .kicker { fill: #79c7ff; font-size: 13px; font-weight: 700; letter-spacing: 1.4px; }
      .box { fill: #0a1220; stroke: #79c7ff; stroke-width: 2; }
      .soft { fill: #111c2e; stroke: #5e94bf; stroke-width: 1.5; }
      .line { fill: none; stroke: #79c7ff; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .solid { stroke-dasharray: none; }
      .dim { stroke: #48657e; marker-end: none; }
    </style>
  </defs>
  <rect width="1600" height="900" rx="28" fill="#070d18"/>
  <text x="800" y="82" text-anchor="middle" class="title">Ledger Security Boundary</text>
  <text x="800" y="116" text-anchor="middle" class="small">Public research only · explicit egress · no sensitive state</text>

  <rect x="626" y="146" width="348" height="92" class="box"/>
  <text x="800" y="178" text-anchor="middle" class="kicker">ACCESS POLICY</text>
  <text x="800" y="208" text-anchor="middle" class="label">Maximum two capabilities</text>
  <text x="800" y="228" text-anchor="middle" class="small">public input + egress · sensitive data off</text>

  <rect x="112" y="350" width="260" height="138" class="box"/>
  <text x="242" y="389" text-anchor="middle" class="kicker">CLIENT</text>
  <text x="242" y="422" text-anchor="middle" class="label">Ledger browser UI</text>
  <text x="242" y="450" text-anchor="middle" class="small">validated ticker request</text>

  <rect x="452" y="286" width="680" height="452" class="box"/>
  <text x="792" y="324" text-anchor="middle" class="kicker">PUBLIC RESEARCH BOUNDARY</text>
  <line x1="452" y1="344" x2="1132" y2="344" stroke="#79c7ff" stroke-width="2"/>

  <rect x="492" y="378" width="270" height="104" class="soft"/>
  <text x="627" y="409" text-anchor="middle" class="small">INPUT GATEWAY</text>
  <text x="627" y="439" text-anchor="middle" class="label">Ticker validation</text>
  <text x="627" y="463" text-anchor="middle" class="small">bounded public input</text>

  <rect x="820" y="378" width="270" height="104" class="soft"/>
  <text x="955" y="409" text-anchor="middle" class="small">ORCHESTRATION</text>
  <text x="955" y="439" text-anchor="middle" class="label">LangGraph state</text>
  <text x="955" y="463" text-anchor="middle" class="small">public evidence only</text>

  <rect x="492" y="526" width="270" height="158" class="soft"/>
  <text x="627" y="558" text-anchor="middle" class="small">EVIDENCE ENGINE</text>
  <rect x="516" y="580" width="222" height="38" fill="#17263b" stroke="#5e94bf"/><text x="627" y="605" text-anchor="middle" class="label">SEC + market retrieval</text>
  <rect x="516" y="630" width="222" height="38" fill="#17263b" stroke="#5e94bf"/><text x="627" y="655" text-anchor="middle" class="label">Python calculations</text>

  <rect x="820" y="526" width="270" height="158" class="soft"/>
  <text x="955" y="558" text-anchor="middle" class="small">OUTPUT ENGINE</text>
  <rect x="844" y="580" width="222" height="38" fill="#17263b" stroke="#5e94bf"/><text x="955" y="605" text-anchor="middle" class="label">Peer validation</text>
  <rect x="844" y="630" width="222" height="38" fill="#17263b" stroke="#5e94bf"/><text x="955" y="655" text-anchor="middle" class="label">Citations + report</text>

  <rect x="1244" y="174" width="254" height="88" fill="#130f18" stroke="#a27084" stroke-width="1.5"/>
  <text x="1371" y="207" text-anchor="middle" fill="#d49bad" font-size="13" font-weight="700" letter-spacing="1.2">SENSITIVE DATA</text>
  <text x="1371" y="238" text-anchor="middle" fill="#efdbe2" font-size="17">disabled · no connection</text>

  <rect x="1244" y="322" width="254" height="110" class="box"/>
  <text x="1371" y="356" text-anchor="middle" class="kicker">PUBLIC SOURCES</text>
  <text x="1371" y="386" text-anchor="middle" class="label">SEC + market APIs</text>
  <text x="1371" y="411" text-anchor="middle" class="small">HTTPS retrieval</text>

  <rect x="1244" y="482" width="254" height="110" class="box"/>
  <text x="1371" y="516" text-anchor="middle" class="kicker">OPTIONAL EGRESS</text>
  <text x="1371" y="546" text-anchor="middle" class="label">Model provider</text>
  <text x="1371" y="571" text-anchor="middle" class="small">one configured HTTPS endpoint</text>

  <rect x="1244" y="642" width="254" height="110" class="box"/>
  <text x="1371" y="676" text-anchor="middle" class="kicker">OPTIONAL TRACE</text>
  <text x="1371" y="706" text-anchor="middle" class="label">LangSmith</text>
  <text x="1371" y="731" text-anchor="middle" class="small">disabled by default</text>

  <rect x="112" y="602" width="260" height="120" class="box"/>
  <text x="242" y="637" text-anchor="middle" class="kicker">ENVIRONMENT</text>
  <text x="242" y="669" text-anchor="middle" class="label">Provider secrets</text>
  <text x="242" y="696" text-anchor="middle" class="small">auth headers only · never graph state</text>

  <path d="M800 238V286" class="line"/>
  <path d="M372 419H492" class="line solid"/>
  <path d="M762 430H820" class="line solid"/>
  <path d="M955 482V504H627V526" class="line solid"/>
  <path d="M762 605H820" class="line solid"/>
  <path d="M1132 390H1244" class="line"/>
  <path d="M1132 536H1244" class="line"/>
  <path d="M1132 697H1244" class="line"/>
  <path d="M372 661H420V790H1180V537H1244" class="line dim"/>
  <path d="M1180 697H1244" class="line dim"/>
  <text x="397" y="405" class="small">ticker</text>
  <text x="1150" y="374" class="small">public HTTPS</text>
  <text x="1150" y="520" class="small">allowlisted HTTPS</text>
  <text x="1150" y="681" class="small">when enabled</text>
  <text x="398" y="648" class="small">auth only</text>

  <text x="92" y="842" class="small">Invariant: no agent session combines untrusted input, sensitive data, and external egress.</text>
</svg>
