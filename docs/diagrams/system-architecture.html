</head><body><main><p>Architecture / Ledger</p><h1>A bounded research system</h1><div class="diagram-container"><svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc">

    .connector{fill:none;stroke:#66768b;stroke-width:1.15;marker-end:url(#arrow)}.connector-link{fill:none;stroke:#306bd9;stroke-width:1.25;marker-end:url(#arrow-blue)}
