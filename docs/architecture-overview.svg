<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Ledger research architecture overview</title>
  <desc id="desc">A public ticker, SEC filings, and market prices pass through the Ledger research engine to produce a cited report. Python owns the calculations; a language model is optional.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0e131c"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#53657d"/>
    </marker>
    <style>
      .sans { font-family: "DM Sans", "Segoe UI", Arial, sans-serif; }
      .serif { font-family: "Instrument Serif", Georgia, serif; }
      .label { fill: #53657d; font-size: 15px; font-weight: 700; letter-spacing: 2px; }
      .title { fill: #0e131c; font-size: 36px; }
      .small { fill: #53657d; font-size: 18px; }
      .step { fill: #306bd9; font-size: 15px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="920" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1599" height="919" fill="none" stroke="#d9e1ec"/>

  <g class="sans">
    <rect x="56" y="42" width="42" height="42" fill="#0e131c"/>
    <text x="77" y="72" text-anchor="middle" fill="#ffffff" class="serif" font-size="29">L</text>
    <text x="118" y="70" fill="#0e131c" font-size="17" font-weight="700" letter-spacing="3">LEDGER</text>
    <text x="800" y="69" text-anchor="middle" class="label">RESEARCH ARCHITECTURE</text>
    <circle cx="1447" cy="63" r="6" fill="#18743f"/>
    <text x="1462" y="69" class="label" font-size="13">LOCAL MVP</text>
  </g>
  <line x1="0" y1="112" x2="1600" y2="112" stroke="#d9e1ec"/>

  <text x="62" y="180" class="serif" font-size="68" fill="#0e131c">Evidence in.</text>
  <text x="62" y="240" class="serif" font-size="68" fill="#306bd9">Research out.</text>
  <text x="832" y="179" class="sans label">THE SYSTEM IN ONE SENTENCE</text>
  <text x="832" y="218" class="sans small">Live public inputs become deterministic metrics,</text>
  <text x="832" y="246" class="sans small">verified peers, primary citations, and a run trace.</text>

  <line x1="56" y1="286" x2="1544" y2="286" stroke="#0e131c"/>

  <g class="sans">
    <text x="56" y="326" class="label">LIVE INPUTS</text>
    <rect x="56" y="348" width="310" height="78" fill="#ffffff" stroke="#d9e1ec"/>
    <text x="80" y="382" class="title serif">Public ticker</text>
    <text x="80" y="408" class="small">research request</text>
    <rect x="56" y="442" width="310" height="78" fill="#ffffff" stroke="#d9e1ec"/>
    <text x="80" y="476" class="title serif">SEC EDGAR</text>
    <text x="80" y="502" class="small">filings + company facts</text>
    <rect x="56" y="536" width="310" height="78" fill="#ffffff" stroke="#d9e1ec"/>
    <text x="80" y="570" class="title serif">Market prices</text>
    <text x="80" y="596" class="small">latest price history</text>

    <text x="504" y="326" class="label">LEDGER</text>
    <rect x="504" y="348" width="530" height="266" fill="#edf3fc" stroke="#306bd9" stroke-width="2"/>
    <text x="536" y="396" class="title serif" font-size="42">Research engine</text>
    <text x="536" y="426" class="small">FastAPI request boundary</text>
    <line x1="536" y1="454" x2="1002" y2="454" stroke="#bed0ed"/>
    <text x="536" y="489" class="label">LANGGRAPH</text>
    <text x="708" y="489" class="small">orders retrieval, validation, and output</text>
    <line x1="536" y1="518" x2="1002" y2="518" stroke="#bed0ed"/>
    <text x="536" y="553" class="label">PYTHON</text>
    <text x="708" y="553" class="small">owns figures, ratios, and verdict</text>
    <text x="536" y="590" fill="#18743f" font-size="16" font-weight="700">DETERMINISTIC CORE</text>

    <text x="1172" y="326" class="label">OUTPUT</text>
    <rect x="1172" y="348" width="372" height="164" fill="#ffffff" stroke="#0e131c"/>
    <text x="1200" y="394" class="title serif" font-size="42">Cited report</text>
    <text x="1200" y="430" class="small">verdict · verified peers</text>
    <text x="1200" y="458" class="small">primary sources · run trace</text>
    <rect x="1172" y="536" width="372" height="78" fill="#ffffff" stroke="#53657d" stroke-dasharray="8 7"/>
    <text x="1200" y="570" class="title serif">Optional model</text>
    <text x="1200" y="596" class="small">peer ideas + prose only</text>
  </g>

  <path d="M366 387H504" fill="none" stroke="#0e131c" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M366 481H444V455H504" fill="none" stroke="#0e131c" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M366 575H444V544H504" fill="none" stroke="#0e131c" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1034 430H1172" fill="none" stroke="#0e131c" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1172 575H1108V520H1034" fill="none" stroke="#53657d" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow-muted)"/>

  <g class="sans">
    <text x="56" y="676" class="label">ONE BOUNDED RUN</text>
    <line x1="56" y1="696" x2="1544" y2="696" stroke="#0e131c"/>

    <g transform="translate(56 718)">
      <rect width="248" height="132" fill="#ffffff" stroke="#d9e1ec"/>
      <text x="20" y="28" class="step">01</text><text x="20" y="79" class="title serif">Resolve</text><text x="20" y="108" class="small">match the company</text>
    </g>
    <g transform="translate(304 718)">
      <rect width="248" height="132" fill="#ffffff" stroke="#d9e1ec"/>
      <text x="20" y="28" class="step">02</text><text x="20" y="79" class="title serif">Retrieve</text><text x="20" y="108" class="small">load public evidence</text>
    </g>
    <g transform="translate(552 718)">
      <rect width="248" height="132" fill="#ffffff" stroke="#d9e1ec"/>
      <text x="20" y="28" class="step">03</text><text x="20" y="79" class="title serif">Calculate</text><text x="20" y="108" class="small">derive the metrics</text>
    </g>
    <g transform="translate(800 718)">
      <rect width="248" height="132" fill="#ffffff" stroke="#d9e1ec"/>
      <text x="20" y="28" class="step">04</text><text x="20" y="79" class="title serif">Select</text><text x="20" y="108" class="small">choose peer candidates</text>
    </g>
    <g transform="translate(1048 718)">
      <rect width="248" height="132" fill="#ffffff" stroke="#d9e1ec"/>
      <text x="20" y="28" class="step">05</text><text x="20" y="79" class="title serif">Verify</text><text x="20" y="108" class="small">check every peer</text>
    </g>
    <g transform="translate(1296 718)">
      <rect width="248" height="132" fill="#ffffff" stroke="#d9e1ec"/>
      <text x="20" y="28" class="step">06</text><text x="20" y="79" class="title serif">Publish</text><text x="20" y="108" class="small">return sources + trace</text>
    </g>
  </g>

  <text x="56" y="889" class="sans label" font-size="13">PUBLIC DATA ONLY</text>
  <text x="800" y="889" text-anchor="middle" class="sans label" font-size="13">PYTHON OWNS THE MATH</text>
  <text x="1544" y="889" text-anchor="end" class="sans label" font-size="13">MISSING DATA STAYS MISSING</text>
</svg>
