      #agent-workflows-root .subtitle { font:400 12px 'DM Sans',Arial,sans-serif;fill:#53657d }
      #agent-workflows-root .node { fill:#fff;stroke:#0e131c;stroke-width:1 }
      #agent-workflows-root .node-soft { fill:#f8fafc;stroke:#9aa8ba;stroke-width:1 }
      #agent-workflows-root .node-focus { fill:#edf3fc;stroke:#306bd9;stroke-width:1.4 }
      #agent-workflows-root .node-dash { fill:#fff;stroke:#9aa8ba;stroke-width:1;stroke-dasharray:5 4 }
      #agent-workflows-root .tag { fill:none;stroke:#9aa8ba;stroke-width:.8 }
      #agent-workflows-root .tag-focus { fill:none;stroke:#306bd9;stroke-width:.8 }
      #agent-workflows-root .tag-text { font:600 7px 'DM Sans',Arial,sans-serif;letter-spacing:1px;fill:#53657d }
      #agent-workflows-root .tag-text-focus { fill:#306bd9 }
      #agent-workflows-root .node-name { font:600 13px 'DM Sans',Arial,sans-serif;fill:#0e131c }
      #agent-workflows-root .node-sub { font:400 9px 'DM Sans',Arial,sans-serif;fill:#53657d }
      #agent-workflows-root .connector { fill:none;stroke:#66768b;stroke-width:1.15;marker-end:url(#agent-workflows-arrow) }
      #agent-workflows-root .connector-link { fill:none;stroke:#306bd9;stroke-width:1.25;marker-end:url(#agent-workflows-arrow-blue) }
      #agent-workflows-root .connector-dash { fill:none;stroke:#66768b;stroke-width:1;stroke-dasharray:5 4;marker-end:url(#agent-workflows-arrow) }
      #agent-workflows-root .edge-mask { fill:#fff }
      #agent-workflows-root .edge-label { font:600 7px 'DM Sans',Arial,sans-serif;letter-spacing:.8px;fill:#53657d;text-anchor:middle }
      #agent-workflows-root .rule { stroke:#d9e1ec;stroke-width:1 }
      #agent-workflows-root .small { font:400 9px 'DM Sans',Arial,sans-serif;fill:#53657d }
      #agent-workflows-root .strong { font-weight:600;fill:#0e131c }
      #agent-workflows-root .lane { fill:#fff;stroke:#d9e1ec;stroke-width:1 }
      #agent-workflows-root .lane-alt { fill:#f8fafc;stroke:#d9e1ec;stroke-width:1 }
      #agent-workflows-root .lane-label { font:600 10px 'DM Sans',Arial,sans-serif;letter-spacing:1.2px;fill:#0e131c }
      #agent-workflows-root .lane-sub { font:400 8px 'DM Sans',Arial,sans-serif;fill:#53657d }
      #agent-workflows-root .step { font:600 7px 'DM Sans',Arial,sans-serif;letter-spacing:1px;fill:#53657d;text-anchor:middle }
      #agent-workflows-root .model { fill:#fff;stroke:#66768b;stroke-width:1;stroke-dasharray:5 4 }
      #agent-workflows-root .gate { fill:#edf3fc;stroke:#306bd9;stroke-width:1.35 }
      #agent-workflows-root .handoff { fill:none;stroke:#306bd9;stroke-width:1;stroke-dasharray:4 4;marker-end:url(#agent-workflows-arrow-blue) }</style>
