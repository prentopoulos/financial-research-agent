<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="security-title security-desc" id="access-triangle-matrix-root">
<title id="security-title">Ledger access triangle security matrix</title><desc id="security-desc">Each live mode has bounded untrusted input and external egress but no sensitive data. A runtime guard rejects any session that combines all three capabilities.</desc>

  <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #access-triangle-matrix-root { color: #0e131c; font-family: 'DM Sans',Arial,sans-serif; }
      #access-triangle-matrix-root .paper { fill:#fff }
      #access-triangle-matrix-root .dots { fill:url(#access-triangle-matrix-dots);opacity:.38 }
      #access-triangle-matrix-root .zone { fill:#f8fafc;stroke:#d9e1ec;stroke-width:1 }
      #access-triangle-matrix-root .zone-title { font:600 9px 'DM Sans',Arial,sans-serif;letter-spacing:1.8px;fill:#53657d }
      #access-triangle-matrix-root .title { font:400 34px 'Instrument Serif',Georgia,serif;fill:#0e131c }
      #access-triangle-matrix-root .subtitle { font:400 12px 'DM Sans',Arial,sans-serif;fill:#53657d }
      #access-triangle-matrix-root .node { fill:#fff;stroke:#0e131c;stroke-width:1 }
      #access-triangle-matrix-root .node-soft { fill:#f8fafc;stroke:#9aa8ba;stroke-width:1 }
      #access-triangle-matrix-root .node-focus { fill:#edf3fc;stroke:#306bd9;stroke-width:1.4 }
      #access-triangle-matrix-root .node-dash { fill:#fff;stroke:#9aa8ba;stroke-width:1;stroke-dasharray:5 4 }
      #access-triangle-matrix-root .tag { fill:none;stroke:#9aa8ba;stroke-width:.8 }
      #access-triangle-matrix-root .tag-focus { fill:none;stroke:#306bd9;stroke-width:.8 }
      #access-triangle-matrix-root .tag-text { font:600 7px 'DM Sans',Arial,sans-serif;letter-spacing:1px;fill:#53657d }
      #access-triangle-matrix-root .tag-text-focus { fill:#306bd9 }
      #access-triangle-matrix-root .node-name { font:600 13px 'DM Sans',Arial,sans-serif;fill:#0e131c }
      #access-triangle-matrix-root .node-sub { font:400 9px 'DM Sans',Arial,sans-serif;fill:#53657d }
      #access-triangle-matrix-root .connector { fill:none;stroke:#66768b;stroke-width:1.15;marker-end:url(#access-triangle-matrix-arrow) }
      #access-triangle-matrix-root .connector-link { fill:none;stroke:#306bd9;stroke-width:1.25;marker-end:url(#access-triangle-matrix-arrow-blue) }
      #access-triangle-matrix-root .connector-dash { fill:none;stroke:#66768b;stroke-width:1;stroke-dasharray:5 4;marker-end:url(#access-triangle-matrix-arrow) }
      #access-triangle-matrix-root .edge-mask { fill:#fff }
      #access-triangle-matrix-root .edge-label { font:600 7px 'DM Sans',Arial,sans-serif;letter-spacing:.8px;fill:#53657d;text-anchor:middle }
      #access-triangle-matrix-root .rule { stroke:#d9e1ec;stroke-width:1 }
      #access-triangle-matrix-root .small { font:400 9px 'DM Sans',Arial,sans-serif;fill:#53657d }
      #access-triangle-matrix-root .strong { font-weight:600;fill:#0e131c }</style>
    <pattern id="access-triangle-matrix-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#d9e1ec"/></pattern>
    <marker id="access-triangle-matrix-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#66768b"/></marker>
    <marker id="access-triangle-matrix-arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#306bd9"/></marker>
  </defs>

  <style>
    .paper{fill:#fff}.dots{fill:url(#access-triangle-matrix-dots);opacity:.38}.zone{fill:#f8fafc;stroke:#d9e1ec;stroke-width:1}
    .zone-title{font:600 9px 'DM Sans',Arial,sans-serif;letter-spacing:1.8px;fill:#53657d}
    .title{font:400 34px 'Instrument Serif',Georgia,serif;fill:#0e131c}.subtitle{font:400 12px 'DM Sans',Arial,sans-serif;fill:#53657d}
    .node{fill:#fff;stroke:#0e131c;stroke-width:1}.node-soft{fill:#f8fafc;stroke:#9aa8ba;stroke-width:1}
    .node-focus{fill:#edf3fc;stroke:#306bd9;stroke-width:1.4}.node-dash{fill:#fff;stroke:#9aa8ba;stroke-width:1;stroke-dasharray:5 4}
    .tag{fill:none;stroke:#9aa8ba;stroke-width:.8}.tag-focus{fill:none;stroke:#306bd9;stroke-width:.8}
    .tag-text{font:600 7px 'DM Sans',Arial,sans-serif;letter-spacing:1px;fill:#53657d}.tag-text-focus{fill:#306bd9}
    .node-name{font:600 13px 'DM Sans',Arial,sans-serif;fill:#0e131c}.node-sub{font:400 9px 'DM Sans',Arial,sans-serif;fill:#53657d}
    .connector{fill:none;stroke:#66768b;stroke-width:1.15;marker-end:url(#access-triangle-matrix-arrow)}.connector-link{fill:none;stroke:#306bd9;stroke-width:1.25;marker-end:url(#access-triangle-matrix-arrow-blue)}
    .connector-dash{fill:none;stroke:#66768b;stroke-width:1;stroke-dasharray:5 4;marker-end:url(#access-triangle-matrix-arrow)}
    .edge-mask{fill:#fff}.edge-label{font:600 7px 'DM Sans',Arial,sans-serif;letter-spacing:.8px;fill:#53657d;text-anchor:middle}
    .rule{stroke:#d9e1ec;stroke-width:1}.small{font:400 9px 'DM Sans',Arial,sans-serif;fill:#53657d}.strong{font-weight:600;fill:#0e131c}
  </style>
<rect class="paper" width="1000" height="560"/><rect class="dots" width="1000" height="560"/>
<text x="40" y="48" class="title">No session gets all three capabilities</text><text x="40" y="72" class="subtitle">The runtime gate permits at most two: untrusted input, sensitive data, and a way out.</text>
<g transform="translate(64 150)"><path d="M116 0L232 200H0Z" fill="#f8fafc" stroke="#0e131c"/><circle cx="116" cy="82" r="34" fill="#edf3fc" stroke="#306bd9" stroke-width="1.5"/><text x="116" y="78" text-anchor="middle" class="node-name">2 max</text><text x="116" y="95" text-anchor="middle" class="node-sub">runtime invariant</text><text x="116" y="-14" text-anchor="middle" class="zone-title">UNTRUSTED INPUT</text><text x="-8" y="224" class="zone-title">SENSITIVE DATA</text><text x="168" y="224" class="zone-title">WAY OUT</text></g>
<rect x="344" y="116" width="616" height="336" rx="8" fill="#fff" stroke="#d9e1ec"/>
<rect x="344" y="116" width="616" height="64" fill="#f8fafc"/><line x1="344" y1="180" x2="960" y2="180" class="rule"/>
<line x1="536" y1="116" x2="536" y2="452" class="rule"/><line x1="664" y1="116" x2="664" y2="452" class="rule"/><line x1="792" y1="116" x2="792" y2="452" class="rule"/><line x1="888" y1="116" x2="888" y2="452" class="rule"/>
<text x="368" y="153" class="zone-title">MODE</text><text x="600" y="146" text-anchor="middle" class="tag-text">UNTRUSTED</text><text x="600" y="158" text-anchor="middle" class="tag-text">INPUT</text><text x="728" y="146" text-anchor="middle" class="tag-text">SENSITIVE</text><text x="728" y="158" text-anchor="middle" class="tag-text">DATA</text><text x="840" y="146" text-anchor="middle" class="tag-text">WAY OUT</text><text x="924" y="146" text-anchor="middle" class="tag-text">COUNT</text>
<g font-family="'DM Sans',Arial,sans-serif"><line x1="344" y1="248" x2="960" y2="248" class="rule"/><line x1="344" y1="316" x2="960" y2="316" class="rule"/><line x1="344" y1="384" x2="960" y2="384" class="rule"/>
<text x="368" y="210" class="node-name">Research run</text><text x="368" y="226" class="node-sub">ticker to report</text><text x="600" y="216" text-anchor="middle" class="small strong">BOUNDED</text><text x="728" y="216" text-anchor="middle" class="small">ABSENT</text><text x="840" y="216" text-anchor="middle" class="small strong">HTTPS</text><text x="924" y="216" text-anchor="middle" class="node-name">2 / 3</text>
<text x="368" y="278" class="node-name">Report chat</text><text x="368" y="294" class="node-sub">verified snapshot</text><text x="600" y="284" text-anchor="middle" class="small strong">BOUNDED</text><text x="728" y="284" text-anchor="middle" class="small">ABSENT</text><text x="840" y="284" text-anchor="middle" class="small strong">MODEL</text><text x="924" y="284" text-anchor="middle" class="node-name">2 / 3</text>
<text x="368" y="346" class="node-name">Explore</text><text x="368" y="362" class="node-sub">public web context</text><text x="600" y="352" text-anchor="middle" class="small strong">BOUNDED</text><text x="728" y="352" text-anchor="middle" class="small">ABSENT</text><text x="840" y="352" text-anchor="middle" class="small strong">WEB + MODEL</text><text x="924" y="352" text-anchor="middle" class="node-name">2 / 3</text>
<rect x="352" y="392" width="600" height="52" rx="4" fill="#edf3fc" stroke="#306bd9"/><text x="368" y="416" class="node-name">Rejected configuration</text><text x="368" y="433" class="node-sub">Untrusted input + sensitive data + external egress never starts.</text><text x="918" y="424" text-anchor="middle" class="small strong">3 / 3 BLOCKED</text></g>
<line x1="40" y1="496" x2="960" y2="496" class="rule"/><text x="40" y="520" class="small strong">Current data boundary</text><text x="164" y="520" class="small">Public-company evidence only. No portfolios, brokerage accounts, files, messages, or trading tools.</text>
</svg>
